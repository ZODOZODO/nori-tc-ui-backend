# 리팩토링 캠페인 순서 87 — netty 4.2.15.Final 잔여 CVE(SPDY/haproxy/http3/xml/http2/ocsp/stomp 계열,
# 전부 CVSS>=7.0)의 fix 버전은 4.2.16.Final 이다. io.spring.dependency-management 는 BOM 관리 버전을
# 선언 버전보다 강제하므로(카탈로그/kts 선언 무효), 문서화된 override 경로인 BOM version property 를
# project property 로 재정의한다. nori-tc-gateway/gradle.properties · nori-tc-exec/gradle.properties 와 동일 방식.
# 2026-08-21 재측정 — 4.2.16.Final 에 CVE-2026-59902(HIGH, netty-transport-sctp)가 새로 붙어
# fix 인 4.2.17.Final 로 올린다.
# Boot 패치가 netty>=4.2.17 을 관리하게 되면 이 줄은 제거한다.
netty.version=4.2.17.Final

