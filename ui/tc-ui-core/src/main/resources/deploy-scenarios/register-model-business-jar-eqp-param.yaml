version: 1

scenario:
  code: REGISTER_MODEL_BUSINESS_JAR_EQP_PARAM
  name: Model + Business Jar + Eqp Param 변경
  summary: Model, Business Jar, Eqp Param 변경을 모두 반영한다.

appliesTo:
  eventTypes:
    - EQP_REGISTER_DEPLOY
  deltaAll:
    - MODEL_CHANGED
    - BUSINESS_JAR_CHANGED
    - EQP_PARAM_CHANGED

steps:
  - order: 10
    code: RELOAD_BUSINESS_PLUGIN
    name: Business plugin 재적재
    targetApp: BUSINESS
    description: business jar 변경이 있는 설비의 plugin/runtime 을 재준비한다.
    when:
      deltaAny:
        - BUSINESS_JAR_CHANGED
    run:
      action: RELOAD_BUSINESS_PLUGIN
      timeoutMs: 60000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: AUTO_COMPENSATABLE
      action: RESTORE_PREVIOUS_BUSINESS_PLUGIN

  - order: 20
    code: RELOAD_BUSINESS_MODEL_RUNTIME
    name: Business model runtime 재적재
    targetApp: BUSINESS
    description: model 변경이 있는 설비의 runtime 을 재준비한다.
    when:
      deltaAny:
        - MODEL_CHANGED
    run:
      action: RELOAD_BUSINESS_MODEL_RUNTIME
      timeoutMs: 15000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: AUTO_COMPENSATABLE
      action: RESTORE_PREVIOUS_BUSINESS_RUNTIME

  - order: 30
    code: UPDATE_MODEL_BINDING
    name: Business model binding 전환
    targetApp: BUSINESS
    description: 설비를 새 runtime identity 로 재바인딩한다.
    when:
      deltaAny:
        - MODEL_CHANGED
        - BUSINESS_JAR_CHANGED
    run:
      action: UPDATE_MODEL_BINDING
      timeoutMs: 10000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: AUTO_COMPENSATABLE
      action: RESTORE_PREVIOUS_MODEL_BINDING

  - order: 40
    code: UPDATE_EQP_PARAM
    name: Eqp parameter 반영
    targetApp: BUSINESS
    description: 설비별 parameter snapshot 을 최신 버전으로 반영한다.
    when:
      deltaAny:
        - EQP_PARAM_CHANGED
    run:
      action: UPDATE_EQP_PARAM
      timeoutMs: 10000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: CONDITIONAL_COMPENSATABLE
      action: RESTORE_PREVIOUS_EQP_PARAM
