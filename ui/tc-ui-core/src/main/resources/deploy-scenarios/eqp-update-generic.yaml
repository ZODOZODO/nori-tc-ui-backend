version: 1

scenario:
  code: EQP_UPDATE_GENERIC
  name: EQP Update Generic
  summary: 현재 상태와 목표 상태의 delta에 따라 필요한 Gateway/Business step을 실행한다.

appliesTo:
  eventTypes:
    - EQP_UPDATE

steps:
  - order: 10
    code: UPSERT_GATEWAY_CONTEXT
    name: Gateway profile 반영
    targetApp: GATEWAY
    description: gateway profile/context metadata를 최신 목표 상태로 반영한다.
    when:
      deltaAny:
        - CONNECTION_ENDPOINT_CHANGED
        - GATEWAY_RUNTIME_SHAPE_CHANGED
    run:
      action: UPSERT_GATEWAY_CONTEXT
      timeoutMs: 15000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: AUTO_COMPENSATABLE
      action: RESTORE_PREVIOUS_GATEWAY_CONTEXT

  - order: 70
    code: REBUILD_GATEWAY_RUNTIME
    name: Gateway runtime 재구성
    targetApp: GATEWAY
    description: protocol/runtime shape 변경 시 runtime을 재구성한다.
    when:
      deltaAny:
        - GATEWAY_RUNTIME_SHAPE_CHANGED
    run:
      action: REBUILD_GATEWAY_RUNTIME
      timeoutMs: 45000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: CONDITIONAL_COMPENSATABLE
      action: RESTORE_PREVIOUS_GATEWAY_RUNTIME

  - order: 80
    code: RECONNECT_GATEWAY
    name: Gateway 재연결
    targetApp: GATEWAY
    description: endpoint만 바뀐 경우 transport만 재연결한다.
    when:
      deltaAny:
        - CONNECTION_ENDPOINT_CHANGED
      deltaNone:
        - GATEWAY_RUNTIME_SHAPE_CHANGED
    run:
      action: RECONNECT_GATEWAY
      timeoutMs: 30000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: CONDITIONAL_COMPENSATABLE
      action: RESTORE_PREVIOUS_GATEWAY_CONTEXT
