version: 1

scenario:
  code: REGISTER_MODEL_BUSINESS_JAR
  name: Model + Business Jar 변경
  summary: Model 변경과 Business Jar 변경을 함께 반영한다.

appliesTo:
  eventTypes:
    - EQP_REGISTER_DEPLOY
  deltaAll:
    - MODEL_CHANGED
    - BUSINESS_JAR_CHANGED

steps:
  - order: 10
    code: UPDATE_MODEL_BINDING
    name: Business model binding 전환
    targetApp: BUSINESS
    description: 설비를 새 runtime identity 로 재바인딩한다.
    when:
      deltaAny:
        - MODEL_CHANGED
        - BUSINESS_JAR_CHANGED
    run:
      action: UPDATE_MODEL_BINDING
      timeoutMs: 10000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: AUTO_COMPENSATABLE
      action: RESTORE_PREVIOUS_MODEL_BINDING
