version: 1

scenario:
  code: EQP_PLC_GROUP_END
  name: EQP PLC Group End
  summary: PLC 폴링 그룹 주기 폴링을 중단한다.

appliesTo:
  eventTypes:
    - EQP_PLC_GROUP_END

steps:
  - order: 10
    code: END_PLC_POLL_GROUP
    name: PLC 폴링 그룹 중단
    targetApp: GATEWAY
    description: groupMessageName 그룹의 주기 폴링 타이머를 Gateway에서 중단한다.
    run:
      action: END_PLC_POLL_GROUP
      timeoutMs: 30000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: false
