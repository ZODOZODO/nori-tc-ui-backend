version: 1

scenario:
  code: REGISTER_BUSINESS_JAR_ONLY
  name: Business Jar 변경
  summary: Business Jar 변경만 반영한다.

appliesTo:
  eventTypes:
    - EQP_REGISTER_DEPLOY
  deltaAll:
    - BUSINESS_JAR_CHANGED

steps:
  - order: 10
    code: RELOAD_BUSINESS_PLUGIN
    name: Business plugin 재적재
    targetApp: BUSINESS
    description: business jar 변경이 있는 설비의 plugin/runtime 을 재준비한다.
    when:
      deltaAny:
        - BUSINESS_JAR_CHANGED
    run:
      action: RELOAD_BUSINESS_PLUGIN
      timeoutMs: 60000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: AUTO_COMPENSATABLE
      action: RESTORE_PREVIOUS_BUSINESS_PLUGIN
