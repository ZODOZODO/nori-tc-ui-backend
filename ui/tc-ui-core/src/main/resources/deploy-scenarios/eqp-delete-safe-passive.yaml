version: 1

scenario:
  code: EQP_DELETE_SAFE_PASSIVE
  name: EQP Delete Safe (PASSIVE)
  summary: PASSIVE 설비는 lifecycle 명령을 지원하지 않으므로 EQP_END 단계를 생략하고 Gateway/Business 메모리만 정리한다.

appliesTo:
  eventTypes:
    - EQP_DELETE

steps:
  - order: 10
    code: DELETE_GATEWAY_MEMORY
    name: Gateway 메모리 삭제
    targetApp: GATEWAY
    description: channel, mailbox, context를 정리한다.
    run:
      action: DELETE_GATEWAY_MEMORY
      timeoutMs: 10000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: CONDITIONAL_COMPENSATABLE
      action: RESTORE_PREVIOUS_GATEWAY_CONTEXT

  - order: 20
    code: DELETE_BUSINESS_BINDING
    name: Business binding 삭제
    targetApp: BUSINESS
    description: eqpId 바인딩과 eqp parameter를 정리하고 ref 0 runtime만 unload한다.
    run:
      action: DELETE_BUSINESS_BINDING
      timeoutMs: 10000
      replyRequired: true
      retry:
        maxAttempts: 1
        backoffMs: 0
    rollback:
      enabled: true
      mode: AUTO_COMPENSATABLE
      action: RESTORE_PREVIOUS_BUSINESS_BINDING
