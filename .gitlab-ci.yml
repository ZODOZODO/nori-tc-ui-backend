stages:
  - check
  - publish
  - trigger

pipeline-ok:
  stage: check
  # 비코드(docs 등) 푸시의 placeholder. GitLab.com 공유러너(월 400분 그룹 쿼터)를 쓰지 않도록
  # 자체호스팅 norilab 러너에서 실행한다(ci_quota_exceeded 회피). publish 잡과 동일 러너/이미지.
  tags:
    - norilab
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  script:
    - echo "no relevant changes"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ui/**/*
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - gradle/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# ------------------------------------------------------------------------------
# W3-1 — 단위 테스트 게이트 (2026.07.13~07.17)
# ------------------------------------------------------------------------------
# publish 전에 gradlew test 로 회귀 차단. Testcontainers 통합 테스트(JdbcAuditLogPortTest 등)는
# @Testcontainers(disabledWithoutDocker=true) 라 러너에 Docker 없으면 자동 skip(DinD 미구성) — 단위 테스트만 실효.
# common 은 build-logic includeBuild 를 위해 sibling clone(publish 잡과 동일).
test:
  stage: check
  tags:
    - norilab
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/norilab/tc-mes/nori-tc-common.git ../nori-tc-common
    - chmod +x ./gradlew
    - ./gradlew test --no-daemon
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ui/**/*
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - gradle/**/*

publish:
  stage: publish
  # W3-2 게이트: test 실패 시 publish 차단(allow_failure 기본 false) → trigger → exec deploy 까지 연쇄 차단.
  needs: ["test"]
  tags:
    - norilab
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/norilab/tc-mes/nori-tc-common.git ../nori-tc-common
    - chmod +x ./gradlew
    - ./gradlew publish --no-daemon
  rules:
    # GitLab UI 의 "Run pipeline" (manual web trigger) — common 업스트림 또는 exec-side
    # app 설정(apps/tc-ui-backend-app/application.yaml 등) 변경을 흡수해 ui-backend 만
    # 재퍼블리시·재배포할 때 사용. ui 코드 변경 없이도 publish 실행(gateway/simulator 동형).
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ui/**/*
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - gradle/**/*

trigger-exec:
  stage: trigger
  needs: ["publish"]
  variables:
    TRIGGER_APP: "tc-ui-backend"
  trigger:
    project: norilab/tc-mes/nori-tc-exec
    branch: main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ui/**/*
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - gradle/**/*
