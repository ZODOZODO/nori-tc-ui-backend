stages:
  - check
  - publish
  - trigger

# settings-conventions(nori-common/build-logic)는 GitLab Package Registry 를 gitlabBaseUrl|GITLAB_BASE_URL 이 있을 때만
# 등록·발행한다(종전 TC build-logic 은 이 주소를 코드에 고정했다). 종전과 같은 주소를 CI 입력으로 준다.
variables:
  GITLAB_BASE_URL: "https://gitlab.noricloud.org"

pipeline-ok:
  stage: check
  # 비코드(docs 등) 푸시의 placeholder. GitLab.com 공유러너(월 400분 그룹 쿼터)를 쓰지 않도록
  # 자체호스팅 nori-msa 러너에서 실행한다(ci_quota_exceeded 회피). publish 잡과 동일 러너/이미지.
  tags:
    - nori-msa
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  script:
    - echo "no relevant changes"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ui/**/*
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - gradle/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# ------------------------------------------------------------------------------
# W3-1 — 단위 테스트 게이트 (2026.07.13~07.17)
# ------------------------------------------------------------------------------
# publish 전에 gradlew test 로 회귀 차단. Testcontainers 통합 테스트(JdbcAuditLogPortTest 등)는
# @Testcontainers(disabledWithoutDocker=true) 라 러너에 Docker 없으면 자동 skip(DinD 미구성) — 단위 테스트만 실효.
# common 은 build-logic includeBuild 를 위해 sibling clone(publish 잡과 동일).
#
# 2026-08-07: `test` -> `build`. 잡 이름은 `needs: ["test"]` 참조 때문에 유지한다.
#   이유 = Phase 4 가 건 커버리지 ratchet 은 `check.dependsOn(jacocoTestCoverageVerification)` 이라
#   `gradlew test` 의 태스크 그래프에 들어가지 않는다(`--dry-run` 실측). 즉 CI 에서 ratchet 이
#   한 번도 돌지 않아 재발 방지 게이트가 개발자 로컬 실행에만 의존하고 있었다.
#   Docker 부재 영향 실측(2026-08-07, DOCKER_HOST 를 닫아 러너 조건 모사): `./gradlew build
#   --rerun-tasks` BUILD SUCCESSFUL — Testcontainers auto-skip 으로도 커버리지가 baseline 아래로
#   내려가지 않는다. 즉 이 전환이 파이프라인을 깨지 않는다.
test:
  stage: check
  tags:
    - nori-msa
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - sh ../nori-common/ci/clone-siblings.sh nori-tc-common
    - chmod +x ./gradlew
    - ./gradlew build --no-daemon
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ui/**/*
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - gradle/**/*

# ------------------------------------------------------------------------------
# W2-5 — OpenAPI 스펙 재생성·드리프트(stale) 차단 (배선만 — 2026.07.20~07.24)
# ------------------------------------------------------------------------------
# OpenApiDocsGenerationTest 가 docs/api-reference/openapi.json 을 재생성한다. 커밋된 스펙과
# 재생성본이 다르면(=stale) git diff --exit-code 가 비0 종료로 잡을 실패시켜 stale 커밋을 차단한다(이슈2).
# 재생성본은 artifact 로 첨부해 차이를 확인할 수 있다. 실 파이프라인 실행·게이트 동작 검증은 week22 —
# 본 주는 배선만이므로 when:manual(사용자 트리거 게이트) + allow_failure(파이프라인 비차단)로 둔다.
openapi-docs:
  stage: check
  tags:
    - nori-msa
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - sh ../nori-common/ci/clone-siblings.sh nori-tc-common
    - chmod +x ./gradlew
    - ./gradlew :ui:adapter:tc-ui-web-adapter:test --tests "com.nori.tc.ui.adapters.web.config.OpenApiDocsGenerationTest" --no-daemon
    - git diff --exit-code docs/api-reference/openapi.json
  artifacts:
    paths:
      - docs/api-reference/openapi.json
    when: always
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

publish:
  stage: publish
  # W3-2 게이트: test 실패 시 publish 차단(allow_failure 기본 false) → trigger → exec deploy 까지 연쇄 차단.
  needs: ["test"]
  tags:
    - nori-msa
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - sh ../nori-common/ci/clone-siblings.sh nori-tc-common
    - chmod +x ./gradlew
    - ./gradlew publish --no-daemon
  rules:
    # GitLab UI 의 "Run pipeline" (manual web trigger) — common 업스트림 또는 exec-side
    # app 설정(apps/tc-ui-backend-app/application.yaml 등) 변경을 흡수해 ui-backend 만
    # 재퍼블리시·재배포할 때 사용. ui 코드 변경 없이도 publish 실행(gateway/simulator 동형).
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ui/**/*
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - gradle/**/*

trigger-exec:
  stage: trigger
  needs: ["publish"]
  variables:
    TRIGGER_APP: "tc-ui-backend"
  trigger:
    project: norisystem/nori-tc/nori-tc-exec
    branch: main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ui/**/*
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - gradle/**/*
